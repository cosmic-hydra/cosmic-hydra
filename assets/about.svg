<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">01 — About</title><desc id="desc">Advaith builds thoughtful interfaces backed by reliable full-stack and cloud systems.</desc>
  <style>
    .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .rise{opacity:0;animation:rise .65s ease forwards}.a1{animation-delay:.1s}.a2{animation-delay:.25s}.a3{animation-delay:.4s}.a4{animation-delay:.55s}.spin{transform-origin:150px 198px;animation:spin 24s linear infinite}
    @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.rise,.spin{animation:none}.rise{opacity:1}}
    @media(prefers-color-scheme:dark){[fill="#1d1d1f"]{fill:#f5f5f7}[fill="#86868b"]{fill:#9b9ba0}[fill="#e8f2ff"]{fill:#102a46}[stroke="#d2d2d7"]{stroke:#30363d}}
  </style>
  <text class="mono rise a1" x="30" y="58" fill="#0071e3" font-size="13" letter-spacing="5">01 / ABOUT</text>
  <line x1="180" y1="53" x2="970" y2="53" stroke="#d2d2d7"/>
  <text class="mono" x="970" y="42" fill="#86868b" font-size="10" text-anchor="end" letter-spacing="2">~/identity</text>

  <g class="spin">
    <circle cx="150" cy="198" r="76" stroke="#d2d2d7"/><circle cx="150" cy="198" r="52" stroke="#0071e3" stroke-dasharray="4 9"/>
    <circle cx="150" cy="122" r="7" fill="#0071e3"/><circle cx="202" cy="198" r="5" fill="#86868b"/><circle cx="113" cy="235" r="5" fill="#0071e3"/>
  </g>
  <text class="mono rise a2" x="150" y="204" fill="#1d1d1f" font-size="13" text-anchor="middle" letter-spacing="2">BUILD / 01</text>

  <text class="sans rise a2" x="270" y="142" fill="#1d1d1f" font-size="25" font-weight="600">I build software where product design</text>
  <text class="sans rise a2" x="270" y="176" fill="#1d1d1f" font-size="25" font-weight="600">meets production engineering.</text>
  <text class="sans rise a3" x="270" y="216" fill="#86868b" font-size="16">Thoughtful interfaces, clean architecture, dependable APIs,</text>
  <text class="sans rise a3" x="270" y="241" fill="#86868b" font-size="16">and cloud infrastructure designed as one coherent system.</text>

  <g class="mono rise a4" font-size="11" letter-spacing="1.5">
    <rect x="270" y="271" width="132" height="29" rx="14.5" fill="#e8f2ff"/><text x="336" y="290" fill="#0071e3" text-anchor="middle">UI ENGINEERING</text>
    <rect x="414" y="271" width="112" height="29" rx="14.5" fill="#e8f2ff"/><text x="470" y="290" fill="#0071e3" text-anchor="middle">FULL STACK</text>
    <rect x="538" y="271" width="80" height="29" rx="14.5" fill="#e8f2ff"/><text x="578" y="290" fill="#0071e3" text-anchor="middle">CLOUD</text>
    <rect x="630" y="271" width="124" height="29" rx="14.5" fill="#e8f2ff"/><text x="692" y="290" fill="#0071e3" text-anchor="middle">OPEN SOURCE</text>
  </g>
</svg>
