<svg viewBox="0 0 1000 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated ASCII portrait of Advaith Vaithianathan</title>
  <desc id="desc">A terminal-inspired portrait reconstructed from text characters, with a scanning beam and live system readout.</desc>
  <style>
    .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace}
    .reveal{transform-origin:500px 110px;animation:reveal 2.2s cubic-bezier(.2,.7,.2,1) both}
    .scan{animation:scan 4.5s ease-in-out infinite}
    .signal{animation:signal 1.8s steps(2) infinite}
    .flicker{animation:flicker 6s linear infinite}
    @keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
    @keyframes scan{0%,100%{transform:translateY(0);opacity:0}10%{opacity:.8}50%{transform:translateY(398px);opacity:.35}90%{opacity:.8}}
    @keyframes signal{50%{opacity:.35}}
    @keyframes flicker{0%,18%,20%,57%,59%,100%{opacity:1}19%,58%{opacity:.75}}
    @media(prefers-reduced-motion:reduce){.reveal,.scan,.signal,.flicker{animation:none}.scan{display:none}}
    @media(prefers-color-scheme:dark){[fill="#f5f5f7"]{fill:#0d1117}[fill="#1d1d1f"]{fill:#f5f5f7}[fill="#86868b"]{fill:#9b9ba0}[stroke="#d2d2d7"]{stroke:#30363d}}
  </style>

  <rect x="24" y="20" width="952" height="570" rx="18" fill="#f5f5f7"/>
  <rect x="24.5" y="20.5" width="951" height="569" rx="17.5" stroke="#d2d2d7"/>
  <circle cx="52" cy="50" r="5" fill="#ff5f57"/>
  <circle cx="70" cy="50" r="5" fill="#febc2e"/>
  <circle cx="88" cy="50" r="5" fill="#28c840"/>
  <text class="mono" x="500" y="55" fill="#86868b" font-size="10" text-anchor="middle" letter-spacing="2">PORTRAIT_RENDERER — ASCII/AV7</text>
  <text class="mono signal" x="946" y="55" fill="#34c759" font-size="10" text-anchor="end" letter-spacing="1.5">● LIVE</text>
  <line x1="24" y1="76" x2="976" y2="76" stroke="#d2d2d7"/>

  <g class="reveal mono flicker" fill="#1d1d1f" font-size="12.5" text-anchor="middle" xml:space="preserve">
    <text x="500" y="105">                    .:-=+********+=-:.                    </text>
    <text x="500" y="118">                 .-+*##%%%%%%%%%%##*+-.                 </text>
    <text x="500" y="131">               .=*#%%%%%%%%%%%%%%%%%%#*=.               </text>
    <text x="500" y="144">              -*#%%%%%%%%%%%%%%%%%%%%%%#*-              </text>
    <text x="500" y="157">             +#%%%%%%%%%%%%%%%%%%%%%%%%%%#+             </text>
    <text x="500" y="170">            *%%%%%%%%%%%%######%%%%%%%%%%%%*            </text>
    <text x="500" y="183">           #%%%%%%%%%#*+=------=+*#%%%%%%%%%#           </text>
    <text x="500" y="196">          +%%%%%%%%#*=:.          .:=*#%%%%%%%+          </text>
    <text x="500" y="209">          #%%%%%%%*-.                .-*%%%%%%%#          </text>
    <text x="500" y="222">         .%%%%%%%*:                    :*%%%%%%%.         </text>
    <text x="500" y="235">        .=#%%%%%#-                      -#%%%%%#=.        </text>
    <text x="500" y="248">       .++*%%%%%+    .:-.        .-:.    +%%%%%*++.       </text>
    <text x="500" y="261">       -+:+%%%%#   .+###*:      :*###+.   #%%%%+:+-       </text>
    <text x="500" y="274">       == :#%%%=   :*+*#+.      .+#*+*:   =%%%#: ==       </text>
    <text x="500" y="287">       :+  *%%%+    .:-:.        .:-:.    +%%%*  +:       </text>
    <text x="500" y="300">        +- =%%%*             ..             *%%%= -+        </text>
    <text x="500" y="313">        .+::#%%#            :--:            #%%#::+.        </text>
    <text x="500" y="326">         :+=*%%%=           .::.           =%%%*=+:         </text>
    <text x="500" y="339">           -*%%%#-       .-======-.       -#%%%*-           </text>
    <text x="500" y="352">            -#%%%*:      :========:      :*%%%#-            </text>
    <text x="500" y="365">             +%%%%#-      .:----:.      -#%%%%+             </text>
    <text x="500" y="378">              *%%%%#+:      ....      :+#%%%%*              </text>
    <text x="500" y="391">               #%%%%%#*=:.        .:=*#%%%%%#               </text>
    <text x="500" y="404">               :#%%%%%%%##*+====+*##%%%%%%%#:               </text>
    <text x="500" y="417">                .+#%%%%%%%%%%%%%%%%%%%%%%#+.                </text>
    <text x="500" y="430">                  :*#%%%%%%%%%%%%%%%%%%#*:                  </text>
    <text x="500" y="443">                    :=*#%%%%%%%%%%%%#*=:                    </text>
    <text x="500" y="456">                  .:-=+*##%%%%%%%%##*+=-:.                  </text>
    <text x="500" y="469">              .-=+*##%%%%%%######%%%%%%##*+=-.              </text>
    <text x="500" y="482">          .-=*#%%%%%%%%%%#*++++++*#%%%%%%%%%%#*=-.          </text>
    <text x="500" y="495">      .-+*#%%%%%%%%%%%%%%+  HYDRA  +%%%%%%%%%%%%%%#*+-.      </text>
    <text x="500" y="508">  .-+*#%%%%%%%%%%%%%%%%%%#*+====+*#%%%%%%%%%%%%%%%%%%#*+-.  </text>
  </g>

  <g class="scan">
    <rect x="265" y="100" width="470" height="2" fill="#0071e3"/>
    <rect x="265" y="102" width="470" height="16" fill="#0071e3" opacity=".08"/>
  </g>

  <line x1="54" y1="534" x2="946" y2="534" stroke="#d2d2d7"/>
  <text class="mono" x="54" y="558" fill="#0071e3" font-size="10" letter-spacing="2">IDENTITY LOCKED / COSMIC-HYDRA</text>
  <text class="mono" x="946" y="558" fill="#86868b" font-size="10" text-anchor="end" letter-spacing="2">32 ROWS · 64 COLS · 1 HUMAN</text>
  <text class="mono" x="54" y="578" fill="#86868b" font-size="9" letter-spacing="1.5">SOURCE: LIGHT → PIXELS → GLYPHS</text>
</svg>
