<svg viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">02 — Selected builds</title><desc id="desc">ZANE, zeroH, and faceformacOS.</desc>
  <style>
    .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{opacity:0;animation:card .7s cubic-bezier(.2,.7,.2,1) forwards}.c2{animation-delay:.15s}.c3{animation-delay:.3s}.flow{stroke-dasharray:3 8;animation:flow 8s linear infinite}
    @keyframes card{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes flow{to{stroke-dashoffset:-88}}@media(prefers-reduced-motion:reduce){.card,.flow{animation:none}.card{opacity:1}}
    @media(prefers-color-scheme:dark){[fill="#f5f5f7"]{fill:#161b22}[fill="#1d1d1f"]{fill:#f5f5f7}[fill="#86868b"]{fill:#9b9ba0}[stroke="#d2d2d7"]{stroke:#30363d}}
  </style>
  <text class="mono" x="30" y="58" fill="#0071e3" font-size="13" letter-spacing="5">02 / SELECTED BUILDS</text>
  <line x1="282" y1="53" x2="970" y2="53" stroke="#d2d2d7"/><text class="mono" x="970" y="42" fill="#86868b" font-size="10" text-anchor="end" letter-spacing="2">~/projects</text>
  <path class="flow" d="M190 105V86H810V105" stroke="#0071e3"/>
  <circle cx="500" cy="86" r="5" fill="#0071e3"/>

  <g class="card">
    <rect x="30" y="105" width="300" height="270" rx="16" fill="#f5f5f7"/><rect x="30.5" y="105.5" width="299" height="269" rx="15.5" stroke="#d2d2d7"/>
    <text class="mono" x="54" y="143" fill="#86868b" font-size="10" letter-spacing="2">01 / PHARMA AI</text>
    <text class="sans" x="54" y="196" fill="#1d1d1f" font-size="32" font-weight="650">ZANE</text>
    <text class="sans" x="54" y="229" fill="#0071e3" font-size="14">Pharma OS for molecular engineering</text>
    <text class="sans" x="54" y="266" fill="#86868b" font-size="14">An AI-native system unifying target</text><text class="sans" x="54" y="288" fill="#86868b" font-size="14">intelligence, generation, and safety.</text>
    <line x1="54" y1="321" x2="306" y2="321" stroke="#d2d2d7"/><text class="mono" x="54" y="348" fill="#1d1d1f" font-size="10" letter-spacing="1.5">PYTHON · AI · CHEMINFORMATICS</text>
  </g>
  <g class="card c2">
    <rect x="350" y="105" width="300" height="270" rx="16" fill="#f5f5f7"/><rect x="350.5" y="105.5" width="299" height="269" rx="15.5" stroke="#d2d2d7"/>
    <text class="mono" x="374" y="143" fill="#86868b" font-size="10" letter-spacing="2">02 / GROUNDED AI</text>
    <text class="sans" x="374" y="196" fill="#1d1d1f" font-size="32" font-weight="650">zeroH</text>
    <text class="sans" x="374" y="229" fill="#0071e3" font-size="14">Memory and verification for agents</text>
    <text class="sans" x="374" y="266" fill="#86868b" font-size="14">A durable grounding layer that makes</text><text class="sans" x="374" y="288" fill="#86868b" font-size="14">answers traceable—or abstains.</text>
    <line x1="374" y1="321" x2="626" y2="321" stroke="#d2d2d7"/><text class="mono" x="374" y="348" fill="#1d1d1f" font-size="10" letter-spacing="1.5">PYTHON · RAG · SQLITE</text>
  </g>
  <g class="card c3">
    <rect x="670" y="105" width="300" height="270" rx="16" fill="#f5f5f7"/><rect x="670.5" y="105.5" width="299" height="269" rx="15.5" stroke="#d2d2d7"/>
    <text class="mono" x="694" y="143" fill="#86868b" font-size="10" letter-spacing="2">03 / NATIVE SYSTEMS</text>
    <text class="sans" x="694" y="196" fill="#1d1d1f" font-size="29" font-weight="650">faceformacOS</text>
    <text class="sans" x="694" y="229" fill="#0071e3" font-size="14">Face authentication for macOS</text>
    <text class="sans" x="694" y="266" fill="#86868b" font-size="14">On-device facial verification for</text><text class="sans" x="694" y="288" fill="#86868b" font-size="14">terminal auth and credentials.</text>
    <line x1="694" y1="321" x2="946" y2="321" stroke="#d2d2d7"/><text class="mono" x="694" y="348" fill="#1d1d1f" font-size="10" letter-spacing="1.5">SWIFT · CORE ML · PAM</text>
  </g>
  <text class="mono" x="970" y="410" fill="#86868b" font-size="10" text-anchor="end" letter-spacing="2">BUILDING IN PUBLIC ↗</text>
</svg>
