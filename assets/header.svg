<svg viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Advaith Vaithianathan</title>
  <desc id="desc">Software engineer focused on interface architecture, full-stack systems, and cloud.</desc>
  <style>
    .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}.draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.5s ease forwards}
    .a1{animation-delay:.1s}.a2{animation-delay:.3s}.a3{animation-delay:.55s}.a4{animation-delay:.8s}.a5{animation-delay:1.05s}
    .orbit{stroke-dasharray:3 10;animation:orbit 18s linear infinite}.pulse{transform-origin:830px 205px;animation:pulse 3s ease-in-out infinite}
    @keyframes rise{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(10px)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes orbit{to{stroke-dashoffset:-130}}@keyframes pulse{50%{transform:scale(1.08);opacity:.55}}
    @media(prefers-reduced-motion:reduce){.rise,.draw,.orbit,.pulse{animation:none}.rise{opacity:1}.draw{stroke-dashoffset:0}}
    @media(prefers-color-scheme:dark){[fill="#f5f5f7"]{fill:#161b22}[fill="#1d1d1f"]{fill:#f5f5f7}[fill="#86868b"]{fill:#9b9ba0}[stroke="#d2d2d7"]{stroke:#30363d}}
  </style>
  <rect x="24" y="24" width="952" height="372" rx="18" fill="#f5f5f7"/>
  <path class="draw a1" d="M64 82H936" stroke="#d2d2d7"/>
  <text class="mono rise a1" x="64" y="66" fill="#86868b" font-size="11" letter-spacing="3">COSMIC-HYDRA / CONTROL NODE</text>
  <circle cx="906" cy="62" r="5" fill="#34c759"/><text class="mono rise a1" x="893" y="67" fill="#86868b" font-size="10" text-anchor="end">ONLINE</text>

  <text class="sans rise a2" x="62" y="172" fill="#1d1d1f" font-size="58" font-weight="650" letter-spacing="-2">Advaith</text>
  <text class="sans rise a3" x="62" y="232" fill="#1d1d1f" font-size="58" font-weight="650" letter-spacing="-2">Vaithianathan.</text>
  <text class="mono rise a4" x="66" y="278" fill="#0071e3" font-size="15" letter-spacing="1.2">SOFTWARE ENGINEER · UI SYSTEMS · FULL STACK · CLOUD</text>
  <text class="sans rise a5" x="64" y="320" fill="#86868b" font-size="17">Designing the interface. Engineering everything behind it.</text>

  <g opacity=".9">
    <circle class="orbit" cx="830" cy="205" r="103" stroke="#0071e3"/>
    <circle class="orbit" cx="830" cy="205" r="72" stroke="#86868b"/>
    <path class="draw a3" d="M758 205H902M830 133V277" stroke="#d2d2d7"/>
    <circle class="pulse" cx="830" cy="205" r="31" fill="#0071e3"/>
    <circle cx="830" cy="102" r="7" fill="#0071e3"/><circle cx="902" cy="205" r="6" fill="#86868b"/><circle cx="779" cy="256" r="5" fill="#0071e3"/>
    <text class="mono rise a5" x="830" y="210" fill="white" font-size="12" text-anchor="middle" letter-spacing="2">AV/7</text>
  </g>
  <path class="draw a5" d="M64 352H936" stroke="#d2d2d7"/>
  <text class="mono rise a5" x="64" y="376" fill="#86868b" font-size="10" letter-spacing="2">DESIGN-DRIVEN / SYSTEM-MINDED / ALWAYS SHIPPING</text>
  <text class="mono rise a5" x="936" y="376" fill="#86868b" font-size="10" text-anchor="end">ADV-AITH.DEV ↗</text>
</svg>
