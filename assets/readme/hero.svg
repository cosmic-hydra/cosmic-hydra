<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 520"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Advaith Vaithianathan</title>
  <desc id="description">
    Software engineer and founder building verifiable AI systems, quantitative infrastructure, and scientific tools.
  </desc>

  <defs>
    <linearGradient id="background" x1="48" y1="24" x2="1156" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07120F"/>
      <stop offset="0.52" stop-color="#081713"/>
      <stop offset="1" stop-color="#061113"/>
    </linearGradient>
    <linearGradient id="glass" x1="60" y1="52" x2="664" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173229" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#0D211B" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#091713" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glassRight" x1="746" y1="54" x2="1148" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#143028" stop-opacity="0.76"/>
      <stop offset="0.54" stop-color="#0B1E19" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#081512" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="42" y1="42" x2="1158" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8FFEB" stop-opacity="0.3"/>
      <stop offset="0.32" stop-color="#70E7AC" stop-opacity="0.13"/>
      <stop offset="0.72" stop-color="#00E85A" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#D8FFEB" stop-opacity="0.08"/>
