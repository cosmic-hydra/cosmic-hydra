    <linearGradient id="chip" x1="76" y1="363" x2="544" y2="399" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17392D" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0C211A" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="greenBloom" cx="0" cy="0" r="1" gradientTransform="translate(1018 98) rotate(123) scale(258)">
      <stop stop-color="#00E85A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#00E85A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealBloom" cx="0" cy="0" r="1" gradientTransform="translate(182 506) rotate(-52) scale(248)">
      <stop stop-color="#00A87A" stop-opacity="0.18"/>
