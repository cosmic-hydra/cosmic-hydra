  <text class="label" x="758" y="87" fill="#A9BDB6" font-size="12">BUILD SIGNAL / CURRENT</text>
  <circle cx="1123" cy="82" r="4" fill="#00E85A"/>
  <circle cx="1123" cy="82" r="9" stroke="#00E85A" stroke-opacity="0.2"/>

