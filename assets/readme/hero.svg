    <filter id="cellGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E85A" flood-opacity="0.55"/>
    </filter>
    <pattern id="technicalGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#9DE8C4" stroke-opacity="0.035"/>
    </pattern>

    <rect id="cell0" width="23" height="23" rx="6" fill="#11241D" stroke="#315045" stroke-opacity="0.42"/>
    <rect id="cell1" width="23" height="23" rx="6" fill="#005A23" stroke="#078837" stroke-opacity="0.62"/>
    <rect id="cell2" width="23" height="23" rx="6" fill="#009D3C" stroke="#12C85A" stroke-opacity="0.75"/>
    <rect id="cell3" width="23" height="23" rx="6" fill="#00E85A" stroke="#8BFFB8" stroke-opacity="0.92"/>

    <style>
      .wordmark {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: -2.2px;
      }
      .ui {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .label {
        font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 1.7px;
      }
    </style>
