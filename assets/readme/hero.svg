  <text class="wordmark" x="74" y="226" fill="#F2F7F5" font-size="58">
    <tspan font-weight="700">Advaith</tspan><tspan font-weight="400"> Vaithianathan</tspan>
  </text>

  <text class="ui" x="76" y="290" fill="#DDE9E4" font-size="22" font-weight="500">
